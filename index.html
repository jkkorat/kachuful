<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kachuful">
 
<title>Kachuful</title>

<style>

:root{
    --green:#115d34;
    --dark:#06311a;
    --gold:#ffd700;
    --red:#d60000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,sans-serif;
}

body{
    background:linear-gradient(135deg,var(--dark),var(--green));
    min-height:100vh;
    padding:15px;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:var(--gold);
    margin-bottom:20px;
}

.panel{
    background:rgba(255,255,255,.08);
    padding:20px;
    border-radius:16px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:120px;
    border:none;
    border-radius:12px;
    padding:12px;
    font-size:16px;
}

.btn{
    border:none;
    border-radius:10px;
    padding:12px 20px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    min-height:48px;
}

.add-btn{
    background:var(--gold);
    color:black;
}

.complete-btn{
    background:#2ecc71;
    color:white;
}

.reset-btn{
    background:#e74c3c;
    color:white;
}

.controls{
    text-align:center;
    margin-top:20px;
}

.suits{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:20px 0;
}

.suit{
    font-size:54px;
    opacity:.25;
    transition:.3s;
}

.active{
    opacity:1;
    transform:scale(1.3);
}

.black{
    color:#111;
}

.red{
    color:#d60000;
}

.current-round{
    text-align:center;
    margin-bottom:20px;
}

.current-symbol{
    font-size:120px;
}

.current-name{
    font-size:28px;
    color:var(--gold);
    font-weight:bold;
}

.players-table{
    background:white;
    color:#222;
    border-radius:16px;
    overflow:hidden;
}

.table-header{
    display:grid;
    grid-template-columns:2fr 1fr 1.5fr 1fr;
    background:#053018;
    color:white;
    font-weight:bold;
    padding:15px;
}

.player-row{
    display:grid;
    grid-template-columns:2fr 1fr 1.5fr 1fr;
    align-items:center;
    padding:15px;
    border-bottom:1px solid #eee;
}

.player-row:nth-child(even){
    background:#f7f7f7;
}

.bet-input{
    width:90px;
    padding:10px;
    border-radius:8px;
    border:2px solid #ddd;
    font-size:16px;
}

.total{
    color:var(--green);
    font-weight:700;
    font-size:22px;
}

.result-cell{
    display:flex;
    align-items:center;
    gap:8px;
}

.lose-label{
    color:#e74c3c;
    font-weight:700;
}

.win-label{
    color:#27ae60;
    font-weight:700;
}

.switch{
    position:relative;
    width:58px;
    height:32px;
    display:inline-block;
}

.switch input{
    position:absolute;
    width:100%;
    height:100%;
    opacity:0;
    z-index:2;
    cursor:pointer;
}

.slider{
    position:absolute;
    inset:0;
    background:#e74c3c;
    border-radius:100px;
    transition:.25s;
}

.slider:before{
    content:"";
    position:absolute;
    width:24px;
    height:24px;
    background:white;
    border-radius:50%;
    top:4px;
    left:4px;
    transition:.25s;
}

.switch input:checked + .slider{
    background:#2ecc71;
}

.switch input:checked + .slider:before{
    transform:translateX(26px);
}

.leaderboard h2{
    color:var(--gold);
    margin-bottom:10px;
}

.leaderboard-item{
    padding:8px 0;
}

@media(max-width:768px){

    .current-symbol{
        font-size:85px;
    }

    .table-header,
    .player-row{
        grid-template-columns:1.4fr .8fr 1.6fr .8fr;
        font-size:13px;
    }

    .bet-input{
        width:70px;
    }

    .suit{
        font-size:40px;
    }
}

</style>
</head>
<body>

<script>
const password = prompt("Enter Password");

if(password !== "Kachuful123"){
    document.write("<h1>Access Denied</h1>");
    throw new Error("Wrong password");
}
</script>

<div class="container">

<h1>♠♣ KACHUFUL ♦♥</h1>

<div class="panel">

<h3>Add Players (One Per Line)</h3>

<br>

<textarea id="names"
placeholder="John&#10;Sarah&#10;Mike"></textarea>

<br>

<button class="btn add-btn" onclick="addPlayers()">
Add Players
</button>

</div>

<div class="suits">
<div id="s0" class="suit black">♠</div>
<div id="s1" class="suit red">♦</div>
<div id="s2" class="suit black">♣</div>
<div id="s3" class="suit red">♥</div>
</div>

<div class="current-round">
<div id="currentSymbol" class="current-symbol">♠</div>
<div id="currentName" class="current-name">
SPADE ROUND
</div>
</div>

<div class="players-table">

<div class="table-header">
<div>Name</div>
<div>Bet</div>
<div>Result</div>
<div>Total</div>
</div>

<div id="players"></div>

</div>

<div class="controls">

<button
class="btn complete-btn"
onclick="completeRound()">
Complete Round
</button>

<button
class="btn reset-btn"
onclick="newGame()">
New Game
</button>

</div>

<br>

<div class="panel leaderboard">

<h2>🏆 Leaderboard</h2>

<div id="leaderboard"></div>

</div>

</div>

<script>

const suits = [
{
symbol:"♠",
name:"SPADE",
color:"#111"
},
{
symbol:"♦",
name:"DIAMOND",
color:"#d60000"
},
{
symbol:"♣",
name:"CLUB",
color:"#111"
},
{
symbol:"♥",
name:"HEART",
color:"#d60000"
}
];

let round = 0;
let players = [];

function addPlayers() {

    var textarea = document.getElementById("names");
    var text = textarea.value;

    if (text.trim() === "") {
        alert("Please enter player names");
        return;
    }

    var names = text.split(/\r?\n/);

    for (var i = 0; i < names.length; i++) {

        var name = names[i].trim();

        if (name === "") {
            continue;
        }

        var exists = false;

        for (var j = 0; j < players.length; j++) {
            if (players[j].name === name) {
                exists = true;
                break;
            }
        }

        if (!exists) {
            players.push({
                name: name,
                total: 0
            });
        }
    }

    textarea.value = "";

    renderPlayers();
    updateLeaderboard();
}
function renderPlayers(){

    const container =
        document.getElementById("players");

    container.innerHTML="";

    players.forEach((player,index)=>{

        const row =
            document.createElement("div");

        row.className="player-row";

        row.innerHTML=`
            <div>${player.name}</div>

            <div>
                <input
                type="number"
                min="0"
                value="0"
                class="bet-input"
                id="bet-${index}">
            </div>

            <div class="result-cell">

                <span class="lose-label">
                L
                </span>

                <label class="switch">

                    <input
                    type="checkbox"
                    id="win-${index}">

                    <span class="slider"></span>

                </label>

                <span class="win-label">
                W
                </span>

            </div>

            <div class="total">
                ${player.total}
            </div>
        `;

        container.appendChild(row);

    });
}

function completeRound(){

    if(players.length===0){

        alert("Please add players first.");
        return;
    }

    players.forEach((player,index)=>{

        const bet =
            Number(
                document.getElementById(
                    `bet-${index}`
                ).value
            ) || 0;

        const won =
            document.getElementById(
                `win-${index}`
            ).checked;

        if(won){

            player.total += bet + 10;

        }

    });

    round++;

    if(round>=suits.length){

        round=0;

    }

    renderPlayers();
    updateLeaderboard();
    updateRoundDisplay();
}

function updateRoundDisplay(){

    document
    .querySelectorAll(".suit")
    .forEach(s=>s.classList.remove("active"));

    document
    .getElementById(`s${round}`)
    .classList.add("active");

    const suit=suits[round];

    const symbol=
        document.getElementById(
            "currentSymbol"
        );

    symbol.textContent =
        suit.symbol;

    symbol.style.color =
        suit.color;

    document
    .getElementById("currentName")
    .textContent =
        suit.name + " ROUND";
}

function updateLeaderboard(){

    const board =
        document.getElementById(
            "leaderboard"
        );

    const sorted =
        [...players]
        .sort((a,b)=>
            b.total-a.total
        );

    board.innerHTML="";

    sorted.forEach((player,index)=>{

        let medal="🏅";

        if(index===0) medal="🥇";
        if(index===1) medal="🥈";
        if(index===2) medal="🥉";

        board.innerHTML += `
            <div class="leaderboard-item">
                ${medal}
                ${player.name}
                -
                ${player.total}
            </div>
        `;
    });
}

function newGame(){

    if(confirm(
        "Start a new game?"
    )){

        players=[];
        round=0;

        renderPlayers();
        updateLeaderboard();
        updateRoundDisplay();
    }
}

window.addEventListener("load", function () {
    updateRoundDisplay();
});

</script>

</body>
</html>
